<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title">
  <title id="title">Skills: Java, Spring Boot, Hibernate, REST APIs, MySQL, Docker, AWS, Cloud, Git, GitHub, Maven, Microservices</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="210" rx="20" fill="#0B1220"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#DCE7F5">
    <g opacity="0"><rect x="24" y="24" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="134" y="51">Java</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".1s" fill="freeze"/></g>
    <g opacity="0"><rect x="260" y="24" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="370" y="51">Spring Boot</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".25s" fill="freeze"/></g>
    <g opacity="0"><rect x="496" y="24" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="606" y="51">Hibernate</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".4s" fill="freeze"/></g>
    <g opacity="0"><rect x="732" y="24" width="244" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="854" y="51">REST APIs</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".55s" fill="freeze"/></g>
    <g opacity="0"><rect x="24" y="84" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="134" y="111">MySQL</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".7s" fill="freeze"/></g>
    <g opacity="0"><rect x="260" y="84" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="370" y="111">Docker</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin=".85s" fill="freeze"/></g>
    <g opacity="0"><rect x="496" y="84" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="606" y="111">AWS</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1s" fill="freeze"/></g>
    <g opacity="0"><rect x="732" y="84" width="244" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="854" y="111">Cloud</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.15s" fill="freeze"/></g>
    <g opacity="0"><rect x="24" y="144" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="134" y="171">Git</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.3s" fill="freeze"/></g>
    <g opacity="0"><rect x="260" y="144" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="370" y="171">GitHub</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.45s" fill="freeze"/></g>
    <g opacity="0"><rect x="496" y="144" width="220" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="606" y="171">Maven</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.6s" fill="freeze"/></g>
    <g opacity="0"><rect x="732" y="144" width="244" height="42" rx="21" fill="#111C31" stroke="url(#border)"/><text x="854" y="171">Microservices</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.75s" fill="freeze"/></g>
